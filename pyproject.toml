[project]
name = "llama-agentic-rag"
version = "0.1.0"
description = "Self-correcting, citation-grounded RAG on local Llama models with LangGraph, evals, FastAPI and an MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Abuzar Zulfiqar" }]
dependencies = [
    "langchain-core>=1.0",
    "langchain-text-splitters>=1.0",
    "langchain-ollama>=1.0",
    "langgraph>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "mcp>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentic_rag", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
