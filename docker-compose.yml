services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    # Remove this block if you do not have an NVIDIA GPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  api:
    build: .
    depends_on:
      - ollama
    environment:
      RAG_OLLAMA_BASE_URL: http://ollama:11434
      RAG_LLM_MODEL: llama3.1:8b
      RAG_EMBED_MODEL: nomic-embed-text
    ports:
      - "8000:8000"

volumes:
  ollama:
